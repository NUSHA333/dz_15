<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Калькулятор</h2>

    <input type="number" id="num1" placeholder="Первое число">
    <input type="number" id="num2" placeholder="Второе число">

    <br><br>

    <button class="operation-btn" data-operation="+">+</button>
    <button class="operation-btn" data-operation="-">-</button>
    <button class="operation-btn" data-operation="*">×</button>
    <button class="operation-btn" data-operation="/">÷</button>

    <div id="result">Результат: </div>

    <script>
        function calculate(a, b, operation) {
            if (operation === "+") {
                return a + b;
            } else if (operation === "-") {
                return a - b;
            } else if (operation === "*") {
                return a * b;
            } else if (operation === "/") {
                if (b === 0) {
                    return "На ноль делить нельзя!";
                }
                return a / b;
            }
        }

        let buttons = document.querySelectorAll(".operation-btn");

        buttons.forEach(function(button) {
            button.addEventListener("click", function() {
                let num1 = Number(document.getElementById("num1").value);
                let num2 = Number(document.getElementById("num2").value);

                let operation = button.dataset.operation;

                let result = calculate(num1, num2, operation);

                document.getElementById("result").textContent = "Результат: " + result;
            });
        });
    </script>    
<script src="script.js"></script>
</html>
